name: Content quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:audit
      - run: pnpm content:source-audit
      - run: pnpm content:source-metadata-audit
      - run: pnpm content:luna-audit
      - run: pnpm content:review-precheck
      - run: pnpm content:llms-audit
      - run: pnpm astro check
      - run: pnpm build
      - run: pnpm content:rss-audit
      - run: pnpm content:image-sitemap-audit
      - run: pnpm content:source-render-audit
      - run: pnpm content:reference-audit
      - run: pnpm content:link-audit
