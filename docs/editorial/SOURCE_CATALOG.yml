# Catálogo de fuentes candidatas para investigación editorial.
# Revisado: 2026-09-12. Una entrada aquí no equivale a una cita verificada:
# el editor debe abrir la página y registrar la fuente concreta en el artículo.
version: 1
checkedDate: '2026-09-12'
entries:
  - id: google-helpful-content
    authority: Google Search Central
    domain: editorial-quality
    evidenceType: policy
    url: https://developers.google.com/search/docs/fundamentals/creating-helpful-content?hl=es
    use: people-first content, authorship, first-hand experience, originality
  - id: google-ai-optimization-guide
    authority: Google Search Central
    domain: seo-geo
    evidenceType: guidance
    url: https://developers.google.com/search/docs/fundamentals/ai-optimization-guide
    use: non-generic answers and original value for AI features in Search
  - id: google-generative-ai-content
    authority: Google Search Central
    domain: editorial-quality
    evidenceType: guidance
    url: https://developers.google.com/search/docs/fundamentals/using-gen-ai-content
    use: safe use of generative AI with accuracy, quality and spam controls
  - id: adsense-eligibility
    authority: Google AdSense
    domain: monetization
    evidenceType: policy
    url: https://support.google.com/adsense/answer/9724?hl=es
    use: original, high-quality content and audience requirement
  - id: adsense-replicated-content
    authority: Google Publisher Policies
    domain: monetization
    evidenceType: policy
    url: https://support.google.com/publisherpolicies/answer/11190248?hl=es
    use: copied, rewritten or auto-generated content without manual value
  - id: adsense-no-editorial-content
    authority: Google Publisher Policies
    domain: monetization
    evidenceType: policy
    url: https://support.google.com/publisherpolicies/answer/11112688?hl=es
    use: low-value pages and content generated without review or curation
  - id: adsense-ad-placement
    authority: Google AdSense
    domain: monetization
    evidenceType: guidance
    url: https://support.google.com/adsense/answer/1282097?hl=es
    use: distinguish ads from navigation and editorial content
  - id: adsense-cookies
    authority: Google AdSense
    domain: privacy
    evidenceType: documentation
    url: https://support.google.com/adsense/answer/7549925?hl=es
    use: disclose advertising cookies and personalization controls
  - id: google-article-schema
    authority: Google Search Central
    domain: schema
    evidenceType: documentation
    url: https://developers.google.com/search/docs/appearance/structured-data/article?hl=es
    use: Article author, dates, image and publisher markup
  - id: google-profile-page-schema
    authority: Google Search Central
    domain: schema
    evidenceType: documentation
    url: https://developers.google.com/search/docs/appearance/structured-data/profile-page?hl=es
    use: real, visible author or organization profile pages
  - id: google-organization-schema
    authority: Google Search Central
    domain: schema
    evidenceType: documentation
    url: https://developers.google.com/search/docs/appearance/structured-data/organization?hl=es
    use: organization identity, logo and real external profiles
  - id: google-structured-data-policies
    authority: Google Search Central
    domain: schema
    evidenceType: policy
    url: https://developers.google.com/search/docs/appearance/structured-data/sd-policies?hl=es
    use: visible, relevant and non-misleading structured data
  - id: google-faq-update
    authority: Google Search Central
    domain: seo-geo
    evidenceType: update
    url: https://developers.google.com/search/blog/2023/08/howto-faq-changes
    use: decide whether FAQ is useful content, never as a guaranteed rich result
  - id: cloudflare-web-analytics
    authority: Cloudflare
    domain: privacy-performance
    evidenceType: documentation
    url: https://developers.cloudflare.com/web-analytics/about/
    use: privacy-first real-user analytics and page performance measurement
  - id: cloudflare-core-web-vitals
    authority: Cloudflare
    domain: privacy-performance
    evidenceType: documentation
    url: https://developers.cloudflare.com/web-analytics/data-metrics/core-web-vitals/
    use: LCP, INP and CLS definitions, percentiles and filters
  - id: noaa-bioluminescence
    authority: NOAA Ocean Exploration
    domain: marine-biology
    evidenceType: institutional-explainer
    url: https://oceanexplorer.noaa.gov/ocean-fact/bioluminescence/
    use: chemical light, functions and open questions
  - id: noaa-ocean-light
    authority: NOAA Ocean Exploration
    domain: marine-biology
    evidenceType: institutional-explainer
    url: https://oceanexplorer.noaa.gov/ocean-fact/light-distributed/
    use: photic, twilight and aphotic zones
  - id: noaa-twilight-zone
    authority: NOAA Ocean Exploration
    domain: marine-biology
    evidenceType: expedition-log
    url: https://oceanexplorer.noaa.gov/expedition-feature/okeanos-ex1903-logs-july6/
    use: observations and taxonomy in the mesopelagic zone
  - id: nasa-life-on-earth
    authority: NASA Earth Observatory
    domain: earth-observation
    evidenceType: institutional-archive
    url: https://science.nasa.gov/earth/earth-observatory/topics/life-on-earth/
    use: biodiversity, vegetation, water and satellite observations
  - id: nasa-auroras
    authority: NASA Science
    domain: heliophysics
    evidenceType: institutional-explainer
    url: https://science.nasa.gov/sun/auroras/
    use: aurora mechanism, missions and citizen science
  - id: nasa-solar-wind
    authority: NASA Science
    domain: heliophysics
    evidenceType: institutional-explainer
    url: https://science.nasa.gov/sun/what-is-the-solar-wind/
    use: solar wind, magnetosphere and space weather
  - id: nasa-magnetosphere
    authority: NASA Science
    domain: heliophysics
    evidenceType: institutional-explainer
    url: https://science.nasa.gov/science-research/earth-science/earths-magnetosphere-protecting-our-planet-from-harmful-space-energy/
    use: magnetic shielding and technology impacts
  - id: usgs-natural-hazards
    authority: U.S. Geological Survey
    domain: geoscience
    evidenceType: institutional-catalog
    url: https://www.usgs.gov/mission-areas/natural-hazards/science/science-topics
    use: earthquakes, volcanoes, landslides, tsunamis and sinkholes
    accessNote: USGS puede devolver 403 a clientes automatizados; abrir y verificar en un navegador normal
  - id: usgs-water-science
    authority: U.S. Geological Survey
    domain: hydrology
    evidenceType: institutional-catalog
    url: https://www.usgs.gov/mission-areas/water-resources/science/
    use: water monitoring, aquatic biology and ecosystem health
    accessNote: USGS puede devolver 403 a clientes automatizados; abrir y verificar en un navegador normal
  - id: iucn-red-list
    authority: IUCN
    domain: conservation
    evidenceType: assessment-database
    url: https://nrl.iucnredlist.org/
    use: current status, distribution, threats and uncertainty per taxon
    accessNote: el sitio público puede devolver 403 a clientes automatizados; citar la evaluación individual del taxón tras verificarla en navegador
  - id: pmc-regeneration-transcriptomics
    authority: PubMed Central
    domain: comparative-biology
    evidenceType: peer-reviewed-review
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11072743/
    use: mechanisms and diversity of animal regeneration
  - id: pmc-cellular-regeneration
    authority: PubMed Central
    domain: comparative-biology
    evidenceType: peer-reviewed-review
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3139400/
    use: progenitors, blastema and lineage restrictions
  - id: pmc-regenerative-loss
    authority: PubMed Central
    domain: comparative-biology
    evidenceType: peer-reviewed-review
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10922877/
    use: evolution and limits of regeneration
  - id: google-image-license-metadata
    authority: Google Search Central
    domain: image-rights
    evidenceType: documentation
    url: https://developers.google.com/search/docs/appearance/structured-data/image-license-metadata?hl=es
    use: license, creator, credit and acquisition metadata for licensed images
  - id: iptc-synthetic-media
    authority: IPTC
    domain: image-rights
    evidenceType: metadata-guidance
    url: https://iptc.org/news/iptc-publishes-metadata-guidance-for-ai-generated-synthetic-media/
    use: label trained-algorithmic media in XMP/IPTC workflows
  - id: c2pa-content-credentials
    authority: C2PA
    domain: image-rights
    evidenceType: technical-standard
    url: https://spec.c2pa.org/specifications/specifications/2.4/specs/ContentCredentials.html
    use: provenance, tools and edits for generated or composited media
  - id: creative-commons-journalist-guide
    authority: Creative Commons
    domain: image-rights
    evidenceType: licensing-guidance
    url: https://creativecommons.org/wp-content/uploads/2023/05/AJournalistsGuideToCreativeCommons2023_1.0.pdf
    use: attribution and linking the human-readable license
  - id: creative-commons-by-deed
    authority: Creative Commons
    domain: image-rights
    evidenceType: licensing-guidance
    url: https://creativecommons.org/licenses/by/4.0/
    use: concrete CC BY 4.0 attribution conditions; verify the asset's actual license
  - id: blue-hole-taam-ja
    authority: Frontiers in Marine Science
    domain: marine-geology
    evidenceType: peer-reviewed-primary
    url: https://doi.org/10.3389/fmars.2024.1387235
    use: recent depth measurement and uncertainty for Taam Ja' blue hole
  - id: geomagnetism-inversion-context
    authority: NASA Science
    domain: geophysics
    evidenceType: institutional-explainer
    url: https://science.nasa.gov/science-research/earth-science/flip-flop-why-variations-in-earths-magnetic-field-arent-causing-todays-climate-change/
    use: cautious framing of field variation and pole reversals
  - id: gecko-atmosphere-adhesion
    authority: Proceedings of the National Academy of Sciences
    domain: biomimetics
    evidenceType: peer-reviewed-primary
    url: https://doi.org/10.1073/pnas.192252799
    use: atmosphere and vacuum conditions in gecko adhesion experiments
  - id: tardigrade-dsup
    authority: eLife
    domain: astrobiology
    evidenceType: peer-reviewed-primary
    url: https://doi.org/10.7554/eLife.47682
    use: Dsup experiments and limits of DNA damage protection claims
  - id: myctophid-migration
    authority: PubMed Central
    domain: marine-biology
    evidenceType: peer-reviewed-review
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4728495/
    use: biomass and vertical migration context for mesopelagic fishes
  - id: yawning-social-contagion
    authority: PLOS ONE
    domain: behavioral-science
    evidenceType: peer-reviewed-primary
    url: https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0028472
    use: association between familiarity and contagious yawning, with sample limits
  - id: zebra-individual-patterns
    authority: PubMed Central
    domain: zoology
    evidenceType: peer-reviewed-primary
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6776349/
    use: individual pattern variation and identification limits
  - id: catatumbo-lightning-record
    authority: NOAA Central Library
    domain: atmospheric-science
    evidenceType: institutional-report
    url: https://repository.library.noaa.gov/view/noaa/52453
    use: historical and observational context for Catatumbo lightning claims
  - id: narwhal-tooth-anatomy
    authority: Anatomical Record
    domain: marine-biology
    evidenceType: peer-reviewed-primary
    url: https://anatomypubs.onlinelibrary.wiley.com/doi/full/10.1002/ar.22886
    use: narwhal tooth variation and the limits of frequency claims
  - id: axolotl-population-context
    authority: PubMed Central
    domain: conservation
    evidenceType: peer-reviewed-primary
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6669047/
    use: dated population and habitat context for wild axolotl claims
  - id: web-vitals-thresholds
    authority: web.dev
    domain: performance
    evidenceType: documentation
    url: https://web.dev/articles/vitals?hl=en
    use: P75 targets for LCP, INP and CLS, separated by mobile and desktop
  - id: google-core-web-vitals
    authority: Google Search Central
    domain: performance-seo
    evidenceType: documentation
    url: https://developers.google.com/search/docs/appearance/core-web-vitals
    use: interpret real-user Core Web Vitals in Search Console without promising ranking gains
  - id: google-technical-requirements
    authority: Google Search Central
    domain: indexing
    evidenceType: documentation
    url: https://developers.google.com/search/docs/essentials/technical
    use: crawlability, HTTP responses and indexable page requirements
  - id: google-sitemap-guidance
    authority: Google Search Central
    domain: indexing
    evidenceType: documentation
    url: https://developers.google.com/search/docs/crawling-indexing/sitemaps/build-sitemap
    use: absolute canonical URLs and sitemap submission limits
  - id: google-canonicalization
    authority: Google Search Central
    domain: indexing
    evidenceType: documentation
    url: https://developers.google.com/search/docs/crawling-indexing/canonicalization-troubleshooting
    use: canonical signals, duplicate handling and reevaluation expectations
  - id: google-search-analytics-api
    authority: Google Search Central
    domain: search-measurement
    evidenceType: api-documentation
    url: https://developers.google.com/webmaster-tools/v1/searchanalytics/query
    use: query, page, country and device dimensions with documented row limits
  - id: cloudflare-performance-monitoring
    authority: Cloudflare
    domain: privacy-performance
    evidenceType: documentation
    url: https://developers.cloudflare.com/use-cases/performance/monitoring/
    use: real-user performance monitoring and no-cookie measurement model
  - id: cloudflare-pages-limits
    authority: Cloudflare
    domain: hosting
    evidenceType: documentation
    url: https://developers.cloudflare.com/pages/platform/limits/
    use: Pages Free file, build, redirect and concurrency limits
  - id: adsense-consent-requirements
    authority: Google AdSense
    domain: privacy-monetization
    evidenceType: policy
    url: https://support.google.com/adsense/answer/13554116?hl=es
    use: certified CMP and consent requirements for EEA, UK and Switzerland
  - id: adsense-tcf-integration
    authority: Google AdSense
    domain: privacy-monetization
    evidenceType: documentation
    url: https://support.google.com/adsense/answer/9804260?hl=es
    use: IAB TCF integration and tag behavior when consent is absent
  - id: adsense-ad-experience
    authority: Google AdSense
    domain: monetization
    evidenceType: guidance
    url: https://support.google.com/adsense/answer/7514132?hl=es
    use: Search Console Ad Experience monitoring and ad quality safeguards
