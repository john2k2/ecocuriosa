    use: guardrail for temporary ad serving limits, traffic quality anomalies and invalid-traffic investigation; never treat a limit as approval
  - id: google-valid-page-metadata
    authority: Google Search Central
    domain: html-metadata
    evidenceType: documentation
    url: https://developers.google.com/search/docs/crawling-indexing/valid-page-metadata
    use: protect title, canonical, meta and JSON-LD by ensuring valid head markup; invalid elements can cause later metadata to be ignored
  - id: google-crawling-errors
    authority: Google Search Central
    domain: crawlability
    evidenceType: troubleshooting
    url: https://developers.google.com/search/docs/crawling-indexing/troubleshoot-crawling-errors
    use: test redirect chains, availability, soft 404, 404/410/301 states and render-blocking resources for author and correction pages
  - id: google-ai-features
    authority: Google Search Central
    domain: ai-search
    evidenceType: documentation
    url: https://developers.google.com/search/docs/appearance/ai-features
    use: keep indexable text, internal links, page experience, images and coherent structured data for AI Overviews and AI Mode; there is no special AI markup
  - id: google-preferred-sources
    authority: Google Search Central
    domain: ai-search
    evidenceType: documentation
    url: https://developers.google.com/search/docs/appearance/preferred-sources
    use: evaluate a voluntary deep link that lets readers add the complete EcoCuriosa domain as a preferred source where Google supports that feature
  - id: google-discover-core-update-2026
    authority: Google Search Central
    domain: discover
    evidenceType: announcement
    url: https://developers.google.com/search/blog/2026/02/discover-core-update
    use: guide people-first Discover briefs toward original, useful, timely work with descriptive headlines and relevant imagery; never treat an update notice as a ranking formula
  - id: google-gen-ai-performance-reports-2026
    authority: Google Search Central
    domain: search-measurement
    evidenceType: announcement
    url: https://developers.google.com/search/blog/2026/06/gen-ai-performance-reports
    use: record first-party visibility by URL, country, device, date, Search generative features and Discover when the report is available in the property
  - id: google-ranking-systems-guide
    authority: Google Search Central
    domain: ranking-systems
    evidenceType: documentation
    url: https://developers.google.com/search/docs/appearance/ranking-systems-guide
    use: replace a single authority score with page- and topic-level audits of helpfulness, originality, links, sources and user experience
  - id: crossref-research-integrity-metadata
    authority: Crossref and DataCite
    domain: scholarly-metadata
    evidenceType: guidance
    url: https://www.crossref.org/publications/guide-metadata-research-integrity/
    use: checklist for contributors, roles, affiliations, funding, versions, corrections, references and stewardship when a scholarly record is justified
  - id: crossref-data-software-citation
    authority: Crossref
    domain: reproducibility
    evidenceType: documentation
    url: https://www.crossref.org/documentation/schema-library/markup-guide-metadata-segments/data-citation/
    use: relate an article to a dataset, software or supplement with persistent identifiers and visible references when those resources support a claim
  - id: datacite-metadata-schema-47
    authority: DataCite
    domain: research-metadata
    evidenceType: standard
    url: https://schema.datacite.org/
    use: model creators, resource type, dates, versions, licences and related identifiers for datasets, observations and supplementary assets
  - id: ror-registry
    authority: Research Organization Registry
    domain: affiliations
    evidenceType: registry
    url: https://ror.org/registry/
    use: normalize verified institutions and funders in future author or source records; never infer a person’s expertise from an organization ID
  - id: icmje-authors-contributors
    authority: ICMJE
    domain: authorship
    evidenceType: guidance
    url: https://www.icmje.org/recommendations/browse/roles-and-responsibilities/defining-the-role-of-authors-and-contributors.html
    use: separate human authorship, contributor roles, final approval and responsibility, and declare AI assistance without listing AI as an author
  - id: elephant-social-disruption-threat-assessment-2022
    authority: PubMed / Scientific Reports
    domain: animal-behaviour
    evidenceType: primary
    url: https://pubmed.ncbi.nlm.nih.gov/35203203/
    use: compare playback experiments on predatory-threat assessment in two African elephant populations; keep population, history and sample context visible
  - id: elephant-matriarch-leadership-2011
    authority: PubMed / Proceedings of the Royal Society B
    domain: animal-behaviour
    evidenceType: primary
    url: https://pubmed.ncbi.nlm.nih.gov/21411454/
    use: support an age-and-experience angle for matriarch decision-making under playback experiments; do not turn the result into a universal memory or intelligence score
  - id: manta-aerial-survey-identification-noaa-2025
    authority: NOAA Fisheries
    domain: species-identification
    evidenceType: institutional
    url: https://www.fisheries.noaa.gov/resource/outreach-materials/giant-manta-ray-and-devil-ray-aerial-survey-id-guide
    use: explain how aerial observers distinguish giant manta rays from devil rays; preserve the guide's survey purpose and identification limits
  - id: manta-recovery-status-review-noaa-2024
    authority: NOAA Fisheries
    domain: conservation
    evidenceType: institutional
    url: https://www.fisheries.noaa.gov/s3/2024-10/Recovery-Status-Review-for-Giant-Manta-Ray_508.pdf
    use: provide a dated U.S. recovery-status and population-evidence context for giant manta rays; do not present it as a global census or a new population estimate
  - id: google-search-essentials-overview
    authority: Google Search Central
    domain: seo-indexing
    evidenceType: documentation
    url: https://developers.google.com/search/docs/essentials
    use: prepublication checklist for technical requirements, people-first content, crawlable links, titles, alt text and structured data; compliance does not guarantee crawling or indexing
  - id: search-console-performance-common-tasks
    authority: Google Search Console
    domain: search-measurement
    evidenceType: documentation
    url: https://support.google.com/webmasters/answer/17010961?hl=es
    use: prioritize queries and pages by clicks, impressions and CTR, compare equivalent periods and record hypotheses; small samples do not prove causality
  - id: google-search-rigorous-testing
    authority: Google Search
    domain: search-measurement
    evidenceType: methodology
    url: https://www.google.com/intl/en_us/search/howsearchworks/how-search-works/rigorous-testing/
    use: design dated before/after comparisons and experiments; Google’s testing methodology is not a private measurement of EcoCuriosa
  - id: chrome-crux-overview
    authority: Chrome UX Report
    domain: cwv-field-data
    evidenceType: dataset
    url: https://developer.chrome.com/docs/crux
    use: interpret real-user Chrome field data and eligibility before treating Lighthouse or a small RUM sample as representative
  - id: w3c-mobile-accessibility
    authority: W3C Web Accessibility Initiative
    domain: mobile-accessibility
    evidenceType: guidance
    url: https://www.w3.org/WAI/standards-guidelines/mobile/
    use: build a mobile accessibility matrix covering small screens, touch, multiple input methods, reflow and assistive technology; guidance is not a conformance test
  - id: w3c-apg-disclosure-navigation
    authority: W3C WAI-ARIA Authoring Practices Task Force
    domain: mobile-navigation
    evidenceType: guidance
    url: https://www.w3.org/WAI/ARIA/apg/patterns/disclosure/examples/disclosure-navigation/
    use: audit disclosure navigation, expanded state, Escape and focus without turning ordinary site navigation into a menu widget; test mobile support manually
  - id: w3c-apg-accessible-names
    authority: W3C WAI-ARIA Authoring Practices Task Force
    domain: mobile-accessibility
    evidenceType: guidance
    url: https://www.w3.org/WAI/ARIA/apg/practices/names-and-descriptions/
    use: check concise accessible names for controls and landmarks, preferring visible text and native semantics; browser and assistive-technology behavior still needs testing
  - id: webdev-main-navigation
    authority: web.dev / Chrome team
    domain: mobile-navigation
    evidenceType: guidance
    url: https://web.dev/articles/website-navigation
    use: review semantic navigation, progressive enhancement, skip links, focus and narrow viewports; tutorial guidance is not a conformance certificate
  - id: adsense-publisher-policies-overview
    authority: Google AdSense
    domain: adsense-policy
    evidenceType: policy
    url: https://support.google.com/adsense/answer/10008391?hl=es
    use: separate site-wide publisher policy and restricted-inventory checks from technical readiness; account status remains private and changeable
  - id: google-publisher-unreliable-harmful-claims
    authority: Google Publisher Policies
    domain: adsense-editorial-risk
    evidenceType: policy
    url: https://support.google.com/publisherpolicies/answer/11188580?hl=es
    use: flag unsupported absolute health, climate or harmful claims for human review; it is not a general scientific quality rubric
  - id: adsense-add-new-site
    authority: Google AdSense
    domain: adsense-readiness
    evidenceType: documentation
    url: https://support.google.com/adsense/answer/12169212?hl=es
    use: distinguish site ownership checks and Ready status from deployed code, editorial quality and approval; private account state must be recorded manually
  - id: csic-good-publishing-practices
    authority: Editorial CSIC
    domain: editorial-integrity
    evidenceType: guidance
    url: https://revistas.csic.es/public/guia_buenas_practicas_csic.pdf
    use: adapt Spanish-language scholarly practices for author responsibility, original attribution, image provenance, funding and correction handling; do not present EcoCuriosa as a CSIC journal
  - id: icmje-manuscript-preparation
    authority: ICMJE
    domain: editorial-method
    evidenceType: guidance
    url: https://icmje.org/recommendations/browse/manuscript-preparation/preparing-for-submission.html
    use: model reproducible method notes, direct original references, limitations and verification against authoritative sources; adapt to web divulgation
  - id: icmje-corrections-version-control
    authority: ICMJE
    domain: corrections
    evidenceType: guidance
    url: https://icmje.org/recommendations/browse/publishing-and-editorial-issues/corrections-and-version-control.html
    use: design visible correction notices, version history, dates and links between current and prior versions; journal guidance adapted proportionally
  - id: icmje-conflicts-interest
    authority: ICMJE
    domain: conflicts-transparency
    evidenceType: guidance
    url: https://icmje.org/recommendations/browse/roles-and-responsibilities/author-responsibilities--conflicts-of-interest.html
    use: disclose relevant affiliations, sponsorships, commercial links and editorial independence; a disclosure does not remove all bias
  - id: cope-core-practices
    authority: Committee on Publication Ethics
    domain: editorial-governance
    evidenceType: guidance
    url: https://publicationethics.org/files/editable-bean/COPE_Core_Practices_0.pdf
    use: adapt policies for authorship, complaints, conflicts, corrections, reproducibility and post-publication review; not an SEO or AdSense requirement
