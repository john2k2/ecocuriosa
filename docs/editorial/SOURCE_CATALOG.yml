  - id: orcid-collect-share-ids
    authority: ORCID
    domain: authorship
    evidenceType: official-documentation
    url: https://info.orcid.org/documentation/collecting-and-sharing-orcid-ids/
    use: aceptar ORCID solo mediante autenticación y autorización de una persona real; no crear IDs ni inferir experiencia desde el identificador
  - id: datacite-metadata-support
    authority: DataCite
    domain: research-metadata
    evidenceType: official-documentation
    url: https://support.datacite.org/docs/metadata-1
    use: registrar creators, contributors, ORCID, afiliaciones, financiación, tipo de recurso, idioma, versión y licencia en manifiestos de datasets
  - id: datacite-commons-works
    authority: DataCite
    domain: reproducibility
    evidenceType: official-documentation
    url: https://support.datacite.org/docs/works-in-datacite-commons
