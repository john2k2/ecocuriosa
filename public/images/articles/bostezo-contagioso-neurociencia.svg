<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ede9fe" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0" />
    </radialGradient>
    <pattern id="mesh" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ede9fe" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fondo base -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />
  <rect width="1200" height="750" fill="url(#mesh)" />
  <circle cx="600" cy="280" r="420" fill="url(#glow)" />

  <!-- Formas orgánicas de fondo -->
  <path d="M-100 500 C 300 400, 500 650, 900 480 C 1100 400, 1250 550, 1300 750 L -100 750 Z" fill="url(#accentGrad)" />
  <path d="M0 620 C 350 550, 750 680, 1200 590 L 1200 750 L 0 750 Z" fill="#3b0764" fill-opacity="0.7" />

  <!-- Elementos simbólicos concéntricos -->
  <g transform="translate(600, 260)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#ede9fe" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6,8" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#a78bfa" stroke-opacity="0.25" stroke-width="2" />
    <circle cx="0" cy="0" r="80" fill="#3b0764" stroke="#a78bfa" stroke-width="2" />
    
    <!-- Emblema de la categoría -->
    <text x="0" y="24" font-family="'Georgia', serif" font-size="64" font-weight="bold" fill="#ede9fe" text-anchor="middle">
      E
    </text>
  </g>

  <!-- Insignia de categoría -->
  <g transform="translate(600, 460)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#3b0764" fill-opacity="0.8" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="1.5" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#ede9fe" text-anchor="middle">
      CIENCIA CURIOSA
    </text>
  </g>

  <!-- Título representativo -->
  <text x="600" y="540" font-family="'Georgia', serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">
    El Enigma del Bostezo Contagioso
  </text>
  
  <!-- Subtítulo de colección -->
  <text x="600" y="585" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" fill="#ede9fe" fill-opacity="0.8" text-anchor="middle">
    EcoCuriosa • Enciclopedia de la Naturaleza y la Ciencia
  </text>

  <line x1="500" y1="620" x2="700" y2="620" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="2" />
</svg>
