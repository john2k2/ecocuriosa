<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="title desc">
  <title id="title">Ilustración editorial sobre aprendizaje social en elefantes</title>
  <desc id="desc">Un diagrama conecta la experiencia de una matriarca, una señal acústica y una respuesta defensiva, con una advertencia sobre los límites de extrapolación.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#152a2a"/>
      <stop offset="0.55" stop-color="#214b49"/>
      <stop offset="1" stop-color="#6b4a35"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f1e7" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#e4efe8" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f4a261"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#071313" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#ffd166"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="250" fill="#ffd166" opacity="0.08"/>
  <circle cx="120" cy="710" r="280" fill="#9ad1c1" opacity="0.08"/>
  <path d="M0 598 C180 550 320 650 510 600 S900 530 1200 610 V750 H0Z" fill="#0d2525" opacity="0.6"/>

  <text x="72" y="72" fill="#ffd166" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">ECOCURiosa · ILUSTRACIÓN EDITORIAL</text>
  <text x="72" y="126" fill="#ffffff" font-family="Georgia, serif" font-size="40" font-weight="700">Qué conserva una matriarca</text>
  <text x="72" y="164" fill="#d8ebe3" font-family="Arial, sans-serif" font-size="19">Experiencia, llamadas y evaluación del riesgo en elefantes africanos</text>

  <!-- Elefante estilizado -->
  <g transform="translate(84 265)" fill="none" stroke="#d8ebe3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 170 C20 102 65 52 143 52 C196 52 225 77 234 119 C244 166 214 195 166 199 L119 199" fill="#315c57" stroke="#ffd166"/>
    <path d="M52 159 L48 252 M111 184 L108 262 M183 177 L190 253"/>
    <path d="M232 119 C275 116 289 132 288 160 C286 191 260 211 240 209"/>
    <path d="M29 98 C-4 80 4 34 44 25 C76 18 95 41 84 72 C78 89 58 100 29 98Z" fill="#315c57"/>
    <path d="M52 250 Q45 265 29 263 M110 260 Q101 273 87 269 M192 250 Q185 266 170 263"/>
    <circle cx="184" cy="102" r="5" fill="#ffd166" stroke="none"/>
    <path d="M286 159 C306 168 313 183 307 198"/>
  </g>
  <text x="195" y="565" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">familia de elefantes</text>

  <!-- flujo -->
  <g filter="url(#shadow)">
    <rect x="382" y="232" width="210" height="128" rx="20" fill="url(#panel)"/>
    <rect x="624" y="232" width="210" height="128" rx="20" fill="url(#panel)"/>
    <rect x="866" y="232" width="250" height="128" rx="20" fill="url(#panel)"/>
  </g>
  <path d="M592 296 H617" stroke="#ffd166" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M834 296 H859" stroke="#ffd166" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="487" y="276" fill="#214b49" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1 · EXPERIENCIA</text>
  <text x="487" y="309" fill="#214b49" font-family="Georgia, serif" font-size="23" text-anchor="middle">matriarca mayor</text>
  <text x="487" y="338" fill="#52716a" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">hecho estudiado</text>
  <text x="729" y="276" fill="#214b49" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2 · SEÑAL</text>
  <text x="729" y="309" fill="#214b49" font-family="Georgia, serif" font-size="23" text-anchor="middle">uno o tres rugidos</text>
  <text x="729" y="338" fill="#52716a" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">playback acústico</text>
  <text x="991" y="276" fill="#214b49" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">3 · RESPUESTA</text>
  <text x="991" y="309" fill="#214b49" font-family="Georgia, serif" font-size="23" text-anchor="middle">decisión defensiva</text>
  <text x="991" y="338" fill="#52716a" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">inferencia acotada</text>

  <rect x="382" y="422" width="734" height="112" rx="20" fill="#102727" stroke="#ffd166" stroke-opacity="0.7" stroke-width="2"/>
  <text x="416" y="461" fill="#ffd166" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1">LÍMITE DE LA EVIDENCIA</text>
  <text x="416" y="496" fill="#ffffff" font-family="Arial, sans-serif" font-size="18">Playback y poblaciones concretas no prueban memoria universal</text>
  <text x="416" y="521" fill="#cfe4dc" font-family="Arial, sans-serif" font-size="15">ni permiten extrapolar causalidad a todos los elefantes.</text>

  <text x="72" y="690" fill="#d8ebe3" font-family="Arial, sans-serif" font-size="14">Diagrama original · hechos, inferencias e hipótesis separados para revisión humana</text>
</svg>
